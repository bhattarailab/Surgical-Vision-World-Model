model:
  num_heads: 8
  d_model: 512
  encoder:
    num_layers: 12
  decoder:
    num_layers: 12
  vae:
    beta: 0.0002
    latent_dim: 32
  first_frame_only: True
data:
  video_shape:
    T: 8
    H: 160
    W: 240
  patch_shape:
    H: 16
    W: 16
  stride: 18 # 3.33 fps for SurgToolLoc
train:
  learning_rate: 0.00002
  weight_decay: 0.01
  batch_size_per_gpu: 28
  gradient_accumulation_steps: 1
  epochs: 1000
  overfit: 4
  max_grad_norm: 1
  viz_keys: ['gt_image', 'image']
